name: chart
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: Lint chart
        run: helm lint chart
      - name: Render chart
        run: helm template stream-monitoring chart > /dev/null
      - name: Render HLS-only chart
        run: >-
          helm template stream-monitoring chart
          --set tsMonitor.enabled=false --set hlsProbe.enabled=true --set packagerAlerts.enabled=true
          | grep -q 'name: hls-probe'
      - name: Check HLS probe script
        run: python3 -m py_compile chart/files/hls_probe.py
