apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "stream-monitoring.name" . }}
  labels:
    {{- include "stream-monitoring.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "stream-monitoring.name" . }}
  endpoints:
    {{- if .Values.tsMonitor.enabled }}
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
    - port: content-metrics
      path: /metrics.txt
      interval: 15s
      scrapeTimeout: 10s
    {{- end }}
    {{- if .Values.hlsProbe.enabled }}
    - port: hls-metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
    {{- end }}
