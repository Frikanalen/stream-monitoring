apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stream-monitoring.name" . }}
  labels:
    {{- include "stream-monitoring.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "stream-monitoring.name" . }}
  template:
    metadata:
      annotations:
        checksum/content-analysis: {{ include (print $.Template.BasePath "/content-analysis-configmap.yaml") . | sha256sum }}
        {{- if .Values.hlsProbe.enabled }}
        checksum/hls-probe: {{ include (print $.Template.BasePath "/hls-probe-configmap.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "stream-monitoring.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.hostNetwork }}
      # Multicast does not cross the pod network, so a multicast stream is
      # joined from the node itself. The metrics ports below then bind on the
      # node, which is why they are configurable.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        {{- if .Values.tsMonitor.enabled }}
        - name: ffmpeg-exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --input
            - {{ .Values.stream.url | quote }}
            - --metrics-port
            - {{ .Values.ports.metrics | quote }}
            - --probe-size
            - {{ .Values.stream.probeSize | quote }}
            - --analyze-duration
            - {{ .Values.stream.analyzeDuration | quote }}
          env:
            - name: RUST_LOG
              value: info
          ports:
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

        - name: content-analysis
          image: "{{ .Values.contentAnalysis.image.repository }}:{{ .Values.contentAnalysis.image.tag }}"
          imagePullPolicy: {{ .Values.contentAnalysis.image.pullPolicy }}
          command:
            - /bin/sh
            - /scripts/analyze.sh
          env:
            - name: STREAM_URL
              value: {{ .Values.stream.url | quote }}
            - name: DETECTION_SECONDS
              value: {{ .Values.contentAnalysis.detectionSeconds | quote }}
            - name: SILENCE_NOISE
              value: {{ .Values.contentAnalysis.silenceNoise | quote }}
            - name: FREEZE_NOISE
              value: {{ .Values.contentAnalysis.freezeNoise | quote }}
          # analyze.sh rewrites metrics.txt every second. If that writer dies
          # (or the script wedges), the web server keeps serving the last
          # values, so restart this container when the file goes stale.
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /tmp/www/metrics.txt) )) -lt 30
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 2
          resources:
            {{- toYaml .Values.contentAnalysis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: content-analysis-script
              mountPath: /scripts
              readOnly: true
            - name: content-analysis-tmp
              mountPath: /tmp

        - name: content-metrics
          image: "{{ .Values.contentAnalysis.metricsImage.repository }}:{{ .Values.contentAnalysis.metricsImage.tag }}"
          imagePullPolicy: {{ .Values.contentAnalysis.metricsImage.pullPolicy }}
          command:
            - python
            - -m
            - http.server
            - {{ .Values.ports.contentMetrics | quote }}
            - --directory
            - /tmp/www
          ports:
            - name: content-metrics
              containerPort: {{ .Values.ports.contentMetrics }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics.txt
              port: content-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics.txt
              port: content-metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: content-analysis-tmp
              mountPath: /tmp
        {{- end }}
        {{- if .Values.hlsProbe.enabled }}

        - name: hls-probe
          image: "{{ .Values.contentAnalysis.metricsImage.repository }}:{{ .Values.contentAnalysis.metricsImage.tag }}"
          imagePullPolicy: {{ .Values.contentAnalysis.metricsImage.pullPolicy }}
          command: ["python", "-B", "-u", "/scripts/hls_probe.py"]
          env:
            - name: HLS_URL
              value: {{ .Values.hlsProbe.url | quote }}
            - name: INTERVAL_SECONDS
              value: {{ .Values.hlsProbe.intervalSeconds | quote }}
            - name: TIMEOUT_SECONDS
              value: {{ .Values.hlsProbe.timeoutSeconds | quote }}
            - name: METRICS_PORT
              value: {{ .Values.ports.hlsMetrics | quote }}
          ports:
            - name: hls-metrics
              containerPort: {{ .Values.ports.hlsMetrics }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: hls-metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: hls-metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.hlsProbe.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: hls-probe-script
              mountPath: /scripts
              readOnly: true
        {{- end }}
      volumes:
        {{- if .Values.hlsProbe.enabled }}
        - name: hls-probe-script
          configMap:
            name: {{ include "stream-monitoring.name" . }}-hls-probe
        {{- end }}
        - name: content-analysis-script
          configMap:
            name: {{ include "stream-monitoring.name" . }}-content-analysis
            defaultMode: 0555
        - name: content-analysis-tmp
          emptyDir: {}

