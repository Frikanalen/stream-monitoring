apiVersion: v1
kind: Service
metadata:
  name: {{ include "stream-monitoring.name" . }}
  labels:
    {{- include "stream-monitoring.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "stream-monitoring.name" . }}
  ports:
    {{- if .Values.tsMonitor.enabled }}
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    - name: content-metrics
      port: 9091
      targetPort: content-metrics
      protocol: TCP
    {{- end }}
    {{- if .Values.hlsProbe.enabled }}
    - name: hls-metrics
      port: 9092
      targetPort: hls-metrics
      protocol: TCP
    {{- end }}
